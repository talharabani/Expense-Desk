name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # The build must not depend on a live Supabase project. These are
      # well-formed placeholders that satisfy the validation in
      # lib/supabase/env.ts, so the build produces the same dynamic routes as
      # production instead of silently prerendering pages as static. No network
      # call is made at build time.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci.placeholder.anon.key.eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6ImNpIiwiaWF0IjowLCJleHAiOjB9.ci-placeholder-signature-long-enough-to-pass-the-length-check-000000' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Should be `npm ci`, which is faster and enforces the lockfile. It fails
      # today because package-lock.json was generated on Windows and omits
      # @emnapi/core and @emnapi/runtime — transitive deps that npm only
      # resolves on Linux. Regenerate the lockfile once on Linux (WSL, a
      # container, or a Codespace) and this can go back to `npm ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
